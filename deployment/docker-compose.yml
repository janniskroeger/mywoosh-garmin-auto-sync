# Deployment als Portainer-Stack: zieht das fertige Image aus der GitHub Container Registry.
# Die Werte unten trägt man in Portainer beim Stack unter "Environment variables" ein.
# Pflicht: MYWHOOSH_EMAIL, MYWHOOSH_PASSWORD, GARMIN_EMAIL, GARMIN_PASSWORD.
services:
  sync:
    image: ghcr.io/janniskroeger/mywhoosh-garmin-sync:${IMAGE_TAG:-latest}
    container_name: mywhoosh-garmin-sync
    environment:
      MYWHOOSH_EMAIL: ${MYWHOOSH_EMAIL}
      MYWHOOSH_PASSWORD: ${MYWHOOSH_PASSWORD}
      GARMIN_EMAIL: ${GARMIN_EMAIL}
      GARMIN_PASSWORD: ${GARMIN_PASSWORD}
      SYNC_INTERVAL_MINUTES: ${SYNC_INTERVAL_MINUTES:-15}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TZ: Europe/Berlin
    volumes:
      - mywhoosh-garmin-sync-data:/data
    restart: unless-stopped
    # Für die MFA-Abfrage von `mywhoosh-garmin-sync login-garmin` in der Container-Konsole
    stdin_open: true
    tty: true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  mywhoosh-garmin-sync-data:
